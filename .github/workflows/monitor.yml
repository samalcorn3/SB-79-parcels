name: Monitor live sources & HCD
# Daily: (1) verify every MPO / county / city endpoint and field mapping still
# works, (1b) flag a city that has published a newer zoning layer than the one
# data/zoning/<id>.json reads, (2) detect amendments to Gov. Code §§ 65912.155–.162 in the Legislative
# Counsel's leginfo database, and (3) watch HCD's SB 79 pages and registry links.
# Opens (or comments on) an issue when something needs a human.
on:
  schedule:
    - cron: '17 14 * * *'   # 14:17 UTC daily
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check live sources
        id: sources
        continue-on-error: true
        run: npm run check:sources -- sources-report.md
      - name: Check zoning layers for newer versions
        id: zoning
        continue-on-error: true
        run: npm run check:zoning -- zoning-report.md
      - name: Check HCD
        id: hcd
        env:
          HCD_REPORT_FILE: hcd-report.md
        run: npm run check:hcd
      - name: Check statute (Gov. Code §§ 65912.155–65912.162 via leginfo export)
        id: statute
        continue-on-error: true
        env:
          STATUTE_REPORT_FILE: statute-report.md
        run: python3 scripts/statute.py
      - name: Open or update issues
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCES_FAILED: ${{ steps.sources.outcome == 'failure' }}
          HCD_ATTENTION: ${{ steps.hcd.outputs.attention }}
          STATUTE_CHANGED: ${{ steps.statute.outcome == 'failure' }}
          ZONING_ATTENTION: ${{ steps.zoning.outcome == 'failure' }}
        run: |
          file_issue () {
            title="$1"; body_file="$2"; label="$3"
            gh label create "$label" --color BFD4F2 --force >/dev/null 2>&1 || true
            num=$(gh issue list --state open --label "$label" --json number --jq '.[0].number')
            if [ -n "$num" ]; then gh issue comment "$num" --body-file "$body_file";
            else gh issue create --title "$title" --label "$label" --body-file "$body_file"; fi
          }
          if [ "$SOURCES_FAILED" = "true" ]; then
            file_issue "Live data source check failing" sources-report.md source-health
          fi
          if [ "$STATUTE_CHANGED" = "true" ]; then
            [ -s statute-report.md ] || echo "Statute check failed to run; see the workflow log." > statute-report.md
            file_issue "SB 79 statute amended or check failing: review data/standards.json" statute-report.md statute-watch
          fi
          if [ "$ZONING_ATTENTION" = "true" ]; then
            [ -s zoning-report.md ] || echo "Zoning freshness check failed to run; see the workflow log." > zoning-report.md
            file_issue "Newer zoning layer published: review data/zoning/" zoning-report.md zoning-watch
          fi
          if [ "$HCD_ATTENTION" = "true" ]; then
            file_issue "HCD SB 79 review needed: update data/jurisdictions.json" hcd-report.md hcd-watch
          fi
